<!doctype html><html lang="en"><meta charset="utf-8"><title>Veyra standalone compositor</title><meta name="viewport" content="width=device-width"><link rel="icon" href="/favicon.svg"><style>body{background:#191c20;color:#dee6ec;font:16px system-ui;margin:30px}main{max-width:960px;margin:auto}canvas{display:block;width:100%;background:#111}label{display:flex;gap:16px;align-items:center;margin:22px 0}output{color:#bade8e}a{color:#bade8e}</style><main><h1>Standalone compositor</h1><p>This page uses only the document core and renderer ES modules.</p><canvas width="960" height="540"></canvas><label>Exposure <input id="exposure" type="range" min="-3" max="3" step=".1" value=".2"><output id="value">0.2</output></label><output id="status">Initializing…</output><p><a href="/">Open Veyra Studio</a></p></main><script type="module">import{createProject}from'/packages/core/index.js';import{Compositor}from'/packages/renderer/renderer.js';const project=createProject(),renderer=new Compositor(document.querySelector('canvas'));const status=document.querySelector('#status');try{await renderer.init();async function draw(){project.nodes.find(n=>n.type==='Grade').params.exposure=Number(document.querySelector('input').value);document.querySelector('#value').value=document.querySelector('input').value;const s=await renderer.render(project,{frame:72});status.textContent=`${s.backend} · ${s.ms.toFixed(1)} ms · ${s.width} × ${s.height}`}document.querySelector('input').oninput=()=>draw().catch(e=>status.textContent=e.message);await draw()}catch(e){status.textContent=e.message}window.addEventListener('pagehide',()=>renderer.dispose());</script></html>
