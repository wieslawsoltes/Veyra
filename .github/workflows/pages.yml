name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: node standalone/server.mjs --check
      - name: Build the static application
        run: node scripts/build-pages.mjs /Veyra/
      - name: Install browser test driver
        run: python3 -m pip install playwright==1.57.0
      - name: Install the pinned Chromium browser
        run: python3 -m playwright install --with-deps chromium
      - name: Test the static application in Chromium
        run: python3 tests/browser-pages.py --managed-browser --screenshot pages-smoke.png
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-smoke
          path: pages-smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify live deployment revision
        shell: python
        run: |
          import json, os, pathlib, time, urllib.request
          expected = os.environ['GITHUB_SHA']
          url = 'https://wieslawsoltes.github.io/Veyra/deployment.json?revision=' + expected
          result = None
          for attempt in range(30):
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = json.load(response)
                  if result.get('commit') == expected and result.get('base') == '/Veyra/' and result.get('mode') == 'browser-local':
                      break
              except Exception as error:
                  print('Waiting for deployment:', type(error).__name__)
              time.sleep(5)
          else:
              raise RuntimeError('Live deployment does not match the published commit')
          pathlib.Path('live-deployment.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
      - run: python3 -m pip install playwright==1.57.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Test the public application in Chromium
        run: python3 tests/browser-pages.py --managed-browser --url https://wieslawsoltes.github.io/Veyra/ --screenshot pages-live.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pages-verification
          path: |
            live-deployment.json
            pages-live.png
          if-no-files-found: error
