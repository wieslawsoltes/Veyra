name: Import complete Veyra source
on:
  push:
    branches: [main]
    paths: ['.source-import/ready.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify and extract original source plus static-hosting adapter
        shell: python
        run: |
          import hashlib, io, json, pathlib, shutil, tarfile
          root = pathlib.Path('.source-import')
          spec = json.loads((root / 'ready.json').read_text())
          chunks = sorted(root.glob('part-*.xz-part'))
          assert len(chunks) == spec['parts'], 'Incomplete source transport'
          archive = b''.join(p.read_bytes() for p in chunks)
          assert len(archive) == spec['size'], 'Archive length mismatch'
          assert hashlib.sha256(archive).hexdigest() == spec['sha256'], 'Archive digest mismatch'
          recovered = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tar:
              for item in tar:
                  path = pathlib.PurePosixPath(item.name)
                  assert item.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts and item.name not in recovered
                  assert item.size < 2000000
                  recovered[item.name] = tar.extractfile(item).read()
          assert len(recovered) == spec['files'], 'Source file count mismatch'
          for name, data in recovered.items():
              # Workflows are installed separately through the authenticated repository connection.
              if name.startswith('.github/workflows/'):
                  continue
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          shutil.rmtree(root)
          print('Verified complete archive:', spec['sha256'])
          print('Recovered', len(recovered), 'source files; workflow files require separate authenticated installation.')
      - name: Verify recovered source
        run: |
          npm test
          node --check public/app/app.js
          node --check public/app/browser-storage.js
          node standalone/server.mjs --check
          node scripts/build-pages.mjs /Veyra/
      - name: Commit complete application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet || git commit -m 'feat: import complete Veyra Studio with browser-local GitHub Pages support'
          git push origin HEAD:main
