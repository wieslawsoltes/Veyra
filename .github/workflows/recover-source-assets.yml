name: Recover original bundled sample
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-source-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Retrieve only the checksum-verified original sample
        shell: python
        run: |
          import hashlib, pathlib, urllib.request, urllib.error
          url = 'https://veyra-studio.wisodev.chatgpt.site/assets/neon-city.jpg'
          request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'image/jpeg'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(2000000)
          except urllib.error.HTTPError as error:
              print('Original asset HTTP status:', error.code)
              print(error.read(300).decode('utf-8', errors='replace'))
              raise
          assert hashlib.sha256(data).hexdigest() == '2cf5cc10f4504d8679a9fe96a34dbd6f95a226257b2c8b31285ea58bc2374f1f', 'Asset digest mismatch'
          target = pathlib.Path('public/assets/neon-city.jpg')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(data)
          print('Original image verified:', len(data), 'bytes')
      - name: Commit the original asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/neon-city.jpg
          git diff --cached --quiet || git commit -m 'assets: restore checksum-verified original neon city sample'
          git push origin HEAD:main
