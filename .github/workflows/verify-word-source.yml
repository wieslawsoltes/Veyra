name: Verify complete source segments
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-word-source.yml'
      - '.source-import/word-*-2.txt'
      - '.source-import/word-corrections*.json'
      - '.source-import/verify_words.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-word-source
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify original binary source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .source-import/verify_words.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-source-verification
          path: word-verification.json
          retention-days: 7
