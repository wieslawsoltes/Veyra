name: Verify publication source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-publication.yml'
      - '.source-import/verify.ready'
      - '.source-import/corrections*.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify original source blocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .source-import/verify_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-verification
          path: publication-verification.json
          retention-days: 7
