          9867940a1caa7349dc6d9ed68d0fb569c21b2e46'''.split()
          root = pathlib.Path('.source-import')
          output = pathlib.Path('verified-recovery')
          output.mkdir()
          def digest(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/Veyra/' + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.load(response)
          def recover(item):
              index, sha = item
              name = 'part-%03d.xz-part' % index
              candidates = []
              if (root / name).exists():
                  candidates.append((root / name).read_bytes())
              if (root / (name + '.b64')).exists():
                  try: candidates.append(base64.b64decode((root / (name + '.b64')).read_text(), validate=False))
                  except Exception: pass
              halves = sorted(root.glob('part-%03d-*.xz-part' % index))
              if halves:
                  candidates.append(b''.join(p.read_bytes() for p in halves))
              for data in candidates:
                  if digest(data) == sha:
                      (output / name).write_bytes(data)
                      return {'index': index, 'status': 'verified', 'source': 'tree'}
              try:
                  data = base64.b64decode(api('git/blobs/' + sha)['content'])
                  if digest(data) != sha:
                      raise ValueError('Git object mismatch')
                  (output / name).write_bytes(data)
                  return {'index': index, 'status': 'verified', 'source': 'retained-object'}
              except urllib.error.HTTPError as error:
                  if error.code != 404: raise
                  return {'index': index, 'status': 'missing-or-corrupt'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              report = list(pool.map(recover, enumerate(expected)))
          try:
              pages = api('pages')
              page_status = {key: pages.get(key) for key in ['html_url', 'status', 'build_type', 'source']}
          except urllib.error.HTTPError as error:
              page_status = {'http_status': error.code}
          missing = [r['index'] for r in report if r['status'] != 'verified']
          summary = {'verified': len(report) - len(missing), 'missing': missing, 'pages': page_status, 'blocks': report}
          (output / 'report.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: verified-recovery
          path: verified-recovery
          retention-days: 7
