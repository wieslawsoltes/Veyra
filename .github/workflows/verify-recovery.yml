name: Verify retained Veyra source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact source blocks and find retained Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, concurrent.futures, hashlib, json, os, pathlib, urllib.request, urllib.error
          expected = '''68759385807929a5a5a4537048bccf4c08187139
