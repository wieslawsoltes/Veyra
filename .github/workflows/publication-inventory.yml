name: Publication source inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publication-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot exact tracked source and publication state
        run: |
          git archive --format=tar HEAD > repository-snapshot.tar
          git rev-parse HEAD > repository-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: publication-source-snapshot
          path: |
            repository-snapshot.tar
            repository-commit.txt
          retention-days: 2
