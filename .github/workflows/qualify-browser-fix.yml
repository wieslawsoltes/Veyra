name: Qualify publication browser fix
on:
  push:
    branches: [main]
    paths: ['.publication-fix.patch', '.github/workflows/qualify-browser-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publication-fix
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply checksum-verified browser fixes
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess
          patch = pathlib.Path('.publication-fix.patch')
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'b32856ae7d1beb61454833618d90563d6554ae83ef8719644eceed0575d8cd64'
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          test = pathlib.Path('tests/browser-pages.py')
          text = test.read_text()
          old = "browser = p.chromium.launch(executable_path=executable, headless=True,\n                args=['--no-sandbox', '--enable-unsafe-webgpu', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'])"
          new = "browser = p.chromium.launch(executable_path=executable, channel='chromium' if args.managed_browser else None, headless=True,\n                args=['--no-sandbox', '--enable-unsafe-webgpu', '--enable-features=Vulkan',\n                      '--use-angle=vulkan', '--use-vulkan=swiftshader',\n                      '--use-webgpu-adapter=swiftshader', '--disable-vulkan-surface'])"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '            before = page.evaluate(frame_digest)\n            if args.screenshot:\n                page.screenshot(path=args.screenshot, full_page=True)'
          new = "            if args.screenshot:\n                page.screenshot(path=args.screenshot, full_page=True)\n            print(json.dumps(page.evaluate('({backend: veyra.renderer.backend, adapter: veyra.renderer._gpu?.adapter.info, lost: veyra.renderer._lost?.message, error: document.getElementById(\"viewer-error\").textContent})')), flush=True)\n            before = page.evaluate(frame_digest)"
          assert text.count(old) == 1
          text = text.replace(old, new)
          test.write_text(text)
          path = pathlib.Path('release/source-manifest.json')
          manifest = json.loads(path.read_text())
          for entry in manifest['files']:
              if entry['path'] == 'tests/browser-pages.py':
                  entry['sha256'] = hashlib.sha256(pathlib.Path(entry['path']).read_bytes()).hexdigest()
          path.write_text(json.dumps(manifest, indent=2) + '\n')
      - run: node scripts/publish-github.mjs --check
      - run: python3 -m pip install playwright==1.57.0
      - run: python3 -m playwright install --with-deps chromium
      - name: Run actual compositor and storage checks in Chromium
        env:
          DEBUG: pw:browser
        run: python3 tests/browser-pages.py --managed-browser --screenshot browser-qualified.png
      - name: Commit only verified browser test changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser-pages.py release/source-manifest.json
          git diff --cached --quiet || git commit -m 'test: verify actual WebGPU output and persistent storage with software Vulkan Chromium'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qualification
          path: browser-qualified.png
          if-no-files-found: ignore
