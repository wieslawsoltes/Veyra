name: Finish verified Veyra source import
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-source-import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Recover and verify every original source byte
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, concurrent.futures, hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request, urllib.error
          subprocess.run(['python3', '.source-import/verify_words.py'], check=True)
          spec = pathlib.Path('.github/workflows/verify-recovery.yml').read_text()
          expected = spec.split("expected = '''", 1)[1].split("'''.split()", 1)[0].split()
          assert len(expected) == 58
          root = pathlib.Path('.source-import')
          def valid(data, index, sha):
              return len(data) == min(12288, 710984 - index * 12288) and hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          def recover(item):
              index, sha = item
              name = 'part-%03d.xz-part' % index
              candidates = []
              for suffix in ['', '.b64']:
                  path = root / (name + suffix)
                  if path.is_file():
                      raw = path.read_bytes()
                      candidates.append(raw)
                      try:
                          candidates.append(base64.b64decode(raw, validate=False))
                      except Exception:
                          pass
              halves = sorted(root.glob('part-%03d-*.xz-part' % index))
              if halves:
                  candidates.append(b''.join(p.read_bytes() for p in halves))
              for data in candidates:
                  if valid(data, index, sha):
                      print('Verified source block', index, 'from repository files', flush=True)
                      return data
              url = 'https://api.github.com/repos/wieslawsoltes/Veyra/git/blobs/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = base64.b64decode(json.load(response)['content'])
                  assert valid(data, index, sha), 'Source block digest mismatch'
                  print('Verified source block', index, 'from retained object', flush=True)
                  return data
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  print('MISSING_SOURCE_BLOCK', index, sha, flush=True)
                  return None
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              chunks = list(pool.map(recover, enumerate(expected)))
          missing = [index for index, data in enumerate(chunks) if data is None]
          assert not missing, 'Missing source blocks: ' + str(missing)
          archive = b''.join(chunks)
          digest = hashlib.sha256(archive).hexdigest()
          assert len(archive) == 710984
          assert digest == 'dfa73760f113cb3c76bc8dbfed35fde078acdc1eb49e846b7499a7ea1774a5fd', 'Complete archive checksum mismatch'
          recovered = {}
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tar:
              for member in tar:
                  name = member.name
                  path = pathlib.PurePosixPath(name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert '.git' not in path.parts and name not in recovered and member.size < 2000000
                  assert not any(p.startswith('.env') for p in path.parts)
                  recovered[name] = tar.extractfile(member).read()
          assert len(recovered) == 149, 'Unexpected source inventory'
          for name, data in recovered.items():
              if name.startswith('.github/workflows/'):
                  continue
              target = pathlib.Path(name)
              assert not target.is_symlink()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'veyra-import'
          output.mkdir()
          (output / 'source.tar.xz').write_bytes(archive)
          report = {'archiveSha256': digest, 'archiveBytes': len(archive), 'verifiedBlocks': 58, 'sourceFiles': len(recovered), 'importedFiles': len(recovered) - 2}
          (output / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          names = [n for n in recovered if not n.startswith('.github/workflows/')]
          subprocess.run(['git', 'add', '--', *names], check=True)
      - name: Test recovered application and static build
        run: |
          npm test
          node standalone/server.mjs --check
          node --check public/app/app.js
          node --check public/app/browser-storage.js
          node scripts/build-pages.mjs /Veyra/
      - name: Commit complete recovered application without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'feat: restore complete Veyra Studio application, libraries, server, media and tests'
          git push origin HEAD:main
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-source-import-verification
          path: ${{ runner.temp }}/veyra-import
          retention-days: 7
